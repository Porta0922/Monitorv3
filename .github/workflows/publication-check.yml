name: Publication preflight
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject private artifacts and recognizable credentials
        run: python scripts/check-publication.py
      - name: Preserve deployment configuration during TLS renewal and rollback
        run: python tests/tls_maintenance_config.py
  browser-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix dashboard
      - run: npm run build --prefix dashboard
      - run: python -m pip install playwright==1.60.0
      - run: python -m playwright install --with-deps chromium
      - name: Untrusted text escaping and production CSP in Chromium
        run: python tests/dashboard_security.py
