name: Publication preflight
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject private artifacts and recognizable credentials
        run: python scripts/check-publication.py
      - name: Preserve deployment configuration during TLS renewal and rollback
        run: python tests/tls_maintenance_config.py
  browser-security:
    # Keep the browser runtime on an OS supported by the pinned Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix dashboard
      - run: npm run build --prefix dashboard
      - run: python -m pip install playwright==1.60.0
      - run: python -m playwright install --with-deps chromium
      - name: Untrusted text escaping and production CSP in Chromium
        run: python tests/dashboard_security.py
  encrypted-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          - timescale/timescaledb:latest-pg15@sha256:6343bdc87ca132c6b53acb26113a6bad1821d188fa39975a745f32ddd9757634
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated recovery fixture
        run: docker build -f tests/Dockerfile.backup-fixture --build-arg BASE_IMAGE='${{ matrix.image }}' -t monitor-backup-validation .
      - name: Verify encryption and PostgreSQL recovery
        run: |
          docker run -d --name monitor-backup-fixture --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$PWD:/workspace:ro" monitor-backup-validation
          docker exec monitor-backup-fixture python3 /workspace/tests/encrypted_backup.py
      - name: Remove disposable fixture
        if: always()
        run: docker rm -fv monitor-backup-fixture
