name: Build and Release
on:
  workflow_run:
    workflows: ['Stack smoke test']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: agent-release
  cancel-in-progress: false
jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      needed: ${{ steps.release.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-gate.py
  windows:
    needs: gate
    if: needs.gate.outputs.needed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build unsigned MSI and assistant
        shell: pwsh
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          dotnet tool install --global wix --version 6.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          wix extension add WixToolset.Util.wixext/6.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX extension failed' }
          cargo build --locked --release -p activity-monitor-agent
          if ($LASTEXITCODE -ne 0) { throw 'Agent compilation failed' }
          $hash=(Get-FileHash target/release/activity-monitor-agent.exe -Algorithm SHA256).Hash
          New-Item -ItemType Directory out,bundle | Out-Null
          $name="monitor-agent-$env:VERSION-windows-x64.msi"
          ./packaging/windows/build-msi.ps1 -BinaryPath target/release/activity-monitor-agent.exe -ExpectedSha256 $hash -Version $env:VERSION -OutputPath "out/$name"
          Copy-Item "out/$name" bundle
          Get-ChildItem packaging/windows/*.ps1 | Where-Object Name -ne 'build-msi.ps1' | Copy-Item -Destination bundle
          Copy-Item docs/AUTOMATIC_UPDATES.md bundle/LEEME.md
          $msiHash=(Get-FileHash "out/$name" -Algorithm SHA256).Hash
          @('@echo off', ('powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0setup.ps1" -LocalTest -ExpectedSha256 '+$msiHash), 'exit /b %errorlevel%') | Set-Content bundle/Instalar-sin-firma.cmd -Encoding ascii
          Compress-Archive -Path bundle/* -DestinationPath "out/monitor-agent-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/*.msi
            out/*.zip
          if-no-files-found: error
  linux:
    needs: gate
    if: needs.gate.outputs.needed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: debian12
            image: rust:1.99.1-slim-bookworm@sha256:86234e857a413004348b471d11a4ebe1aa92d2eae2b6b143cac68fd1ac3c48be
          - distro: ubuntu2204
            image: ubuntu:22.04@sha256:9abcaffc92a5279fff3a6a41635c0800ea33e528425fb389658806476e7defde
          - distro: ubuntu2404
            image: ubuntu:24.04@sha256:24737cef17f4e22b1977df7d9a05e77c4e28b7da5b8911f8d8ccda136bf3573c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Build distribution package
        env:
          BUILD_IMAGE: ${{ matrix.image }}
          DISTRO: ${{ matrix.distro }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          docker build -f packaging/linux/Dockerfile --build-arg BUILD_IMAGE="$BUILD_IMAGE" --output type=local,dest=out .
          mv "out/monitor-agent-$VERSION-amd64.deb" "out/monitor-agent-$VERSION-$DISTRO-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.distro }}
          path: out/*.deb
          if-no-files-found: error
  publish:
    needs: [gate, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish immutable versioned candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          git archive --format=zip --output="artifacts/Monitor-$VERSION-source.zip" HEAD
          cp docs/AUTOMATIC_UPDATES.md artifacts/
          (cd artifacts && sha256sum *.msi *.deb *.zip > SHA256SUMS)
          gh release create "agent-v$VERSION" artifacts/* --target "$RELEASE_SHA" --prerelease --title "Monitor Agent $VERSION (candidato sin firma)" --notes-file docs/AUTOMATIC_UPDATES.md
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "v3.4.0" or .tag_name == "3.4.0") | .id' | while read -r id; do
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F prerelease=true -f make_latest=false
          done
