name: Build and Release

on:
  push:
    tags:
      - 'agent-v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build release
        shell: pwsh
        run: |
          $manifest = Get-Content agent/Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "agent-v$version") { throw 'Tag and agent version differ.' }
          cargo build --locked --release -p activity-monitor-agent
          if ($LASTEXITCODE -ne 0) { throw 'Agent build failed.' }
          $hash = (Get-FileHash target/release/activity-monitor-agent.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  activity-monitor-agent.exe" | Set-Content target/release/SHA256SUMS -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: activity-monitor-agent.exe
          path: |
            target/release/activity-monitor-agent.exe
            target/release/SHA256SUMS
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ActivityMonitor ${{ github.ref_name }}
          body: |
            ## ActivityMonitor Agent ${{ github.ref_name }}

            ### Descarga
            - [`activity-monitor-agent.exe`](Windows)

            ### Instalación
            Ver [`README.md`](https://github.com/Porta0922/Monitorv3#instalaci%C3%B3n) para instrucciones.
          files: |
            activity-monitor-agent.exe/*
          draft: true
          prerelease: ${{ startsWith(github.ref_name, 'agent-v0.') }}
