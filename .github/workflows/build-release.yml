name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build release
        shell: pwsh
        run: |
          (Get-Content Cargo.toml -Raw) -replace '"agent", "server"', '"agent"' | Set-Content Cargo.toml
          cargo build --release -p activity-monitor-agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: activity-monitor-agent.exe
          path: target/release/activity-monitor-agent.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ActivityMonitor ${{ github.ref_name }}
          body: |
            ## ActivityMonitor Agent ${{ github.ref_name }}

            ### Descarga
            - [`activity-monitor-agent.exe`](Windows)

            ### Instalación
            Ver [`README.md`](https://github.com/Porta0922/Monitorv3#instalaci%C3%B3n) para instrucciones.
          files: |
            activity-monitor-agent.exe/*
          draft: false
          prerelease: false
