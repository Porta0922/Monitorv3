[package]
name = "activity-monitor-agent"
version = "0.1.0"
edition = "2021"
authors = ["ActivityMonitor Team"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.31", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10.3"
rand = "0.8"
sysinfo = "0.29"
# Native roots honor SSL_CERT_FILE; select ring without generic rustls defaults.
lapin = { version = "4.12.3", default-features = false, features = ["tokio", "rustls-native-certs", "rustls--ring"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
hostname = "0.4"
dotenvy = "0.15"
hyper = { version = "0.14", features = ["server", "http1", "tcp"] }
open = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.50"
winapi = { version = "0.3", features = ["winnt", "jobapi", "jobapi2", "processthreadsapi", "winuser", "handleapi", "winbase", "shellapi", "libloaderapi", "wingdi", "wincon"] }
windows = { version = "0.48", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Memory"] }
windows-service = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
signal-hook = "0.3"
rdev = "0.5"
# Window metadata only; avoid screenshot/recording and PipeWire dependencies.
xcb = "1.7"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
signal-hook = "0.3"
rdev = "0.5"

[[bin]]
name = "activity-monitor-agent"
path = "src/main.rs"
