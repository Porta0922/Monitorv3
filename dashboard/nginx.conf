log_format monitor_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=monitor_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=monitor_login:1m rate=10r/m;
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout monitor_safe;
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_req_status 429;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    # Never pass hidden files, backup/configuration files or source maps to the SPA.
    location ~ /\. { return 404; }
    location ~* \.(?:env|ini|conf|sql|sqlite3?|db|bak|old|orig|key|pem|pfx|p12|map|log)$ { return 404; }
    location = /api/auth/login {
        limit_req zone=monitor_login burst=10 nodelay;
        set $api_upstream http://server:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
    location /api/ {
        limit_req zone=monitor_api burst=120 nodelay;
        set $api_upstream http://server:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
