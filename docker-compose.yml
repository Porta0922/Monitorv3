version: '3.8'

services:
  # PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: activity-monitor-postgres
    environment:
      - POSTGRES_DB=activity_monitor
      - POSTGRES_USER=monitor_user
      - POSTGRES_PASSWORD=monitor_password
      # ELIMINAMOS POSTGRES_INITDB_ARGS porque causa el error -c
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor_user -d activity_monitor"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - activity-monitor

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: activity-monitor-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"    # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - activity-monitor

  # Redis
  redis:
    image: redis:7-alpine
    container_name: activity-monitor-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - activity-monitor

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  activity-monitor:
    driver: bridge