services:
  postgres:
    restart: unless-stopped
    image: timescale/timescaledb:latest-pg15@sha256:6343bdc87ca132c6b53acb26113a6bad1821d188fa39975a745f32ddd9757634
    environment:
      - POSTGRES_DB=activity_monitor
      - POSTGRES_USER=monitor_user
      - POSTGRES_PASSWORD=monitor_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U monitor_user -d activity_monitor" ]
      interval: 5s
      timeout: 10s
      retries: 8
    networks:
      - activity-monitor

  rabbitmq:
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    restart: unless-stopped
    image: rabbitmq:3.12-management-alpine@sha256:0b44fbcc3a4bf22d00090f1353127577dbe1fcb109c41669733a9d7ecf6c3a78
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity" ]
      interval: 5s
      timeout: 10s
      retries: 8
    networks:
      - activity-monitor

  server:
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: DockerServer/Dockerfile
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AGENT_AUTH_TOKEN: ${AGENT_AUTH_TOKEN:-change-me-in-production}
      AGENT_CONFIG_MONITORING_PAUSED: "${AGENT_CONFIG_MONITORING_PAUSED:-false}"
      AGENT_CONFIG_ENABLED_MONITORS: "${AGENT_CONFIG_ENABLED_MONITORS:-}"
      AGENT_CONFIG_DISABLED_MONITORS: "${AGENT_CONFIG_DISABLED_MONITORS:-}"
      AGENT_CONFIG_WINDOW_ACTIVITY_INTERVAL: "${AGENT_CONFIG_WINDOW_ACTIVITY_INTERVAL:-2}"
      AGENT_CONFIG_HEARTBEAT_INTERVAL: "${AGENT_CONFIG_HEARTBEAT_INTERVAL:-60}"
      AGENT_CONFIG_USB_DETECTOR_INTERVAL: "${AGENT_CONFIG_USB_DETECTOR_INTERVAL:-60}"
      AGENT_CONFIG_USB_COPY_INTERVAL: "${AGENT_CONFIG_USB_COPY_INTERVAL:-60}"
      AGENT_CONFIG_WIFI_INTERVAL: "${AGENT_CONFIG_WIFI_INTERVAL:-120}"
      AGENT_CONFIG_RUNNING_APPS_INTERVAL: "${AGENT_CONFIG_RUNNING_APPS_INTERVAL:-60}"
      AGENT_CONFIG_INVENTORY_INTERVAL_DAYS: "${AGENT_CONFIG_INVENTORY_INTERVAL_DAYS:-1}"
      AGENT_CONFIG_HEATMAP_INTERVAL: "${AGENT_CONFIG_HEATMAP_INTERVAL:-3600}"
      AGENT_CONFIG_RESOURCE_LOGGER_INTERVAL: "${AGENT_CONFIG_RESOURCE_LOGGER_INTERVAL:-60}"
      AGENT_CONFIG_OSQUERY_SCHEDULER_SECONDS: "${AGENT_CONFIG_OSQUERY_SCHEDULER_SECONDS:-0}"
      AGENT_CONFIG_IDLE_THRESHOLD: "${AGENT_CONFIG_IDLE_THRESHOLD:-300}"
      AGENT_CONFIG_ACTIVITY_HEARTBEAT: "${AGENT_CONFIG_ACTIVITY_HEARTBEAT:-30}"
      DATABASE_URL: postgresql://monitor_user:monitor_password@postgres:5432/activity_monitor
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - activity-monitor

  dashboard:
    restart: unless-stopped
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - activity-monitor

  db-maintenance:
    restart: unless-stopped
    image: timescale/timescaledb:latest-pg15@sha256:6343bdc87ca132c6b53acb26113a6bad1821d188fa39975a745f32ddd9757634
    environment:
      PGPASSWORD: monitor_password
      METRICS_RAW_RETENTION_DAYS: ${METRICS_RAW_RETENTION_DAYS:-14}
      METRICS_SUMMARY_RETENTION_DAYS: ${METRICS_SUMMARY_RETENTION_DAYS:-365}
      HISTORY_RETENTION_ENABLED: ${HISTORY_RETENTION_ENABLED:-false}
      ACTIVITY_RETENTION_DAYS: ${ACTIVITY_RETENTION_DAYS:-30}
      SESSION_EVENT_RETENTION_DAYS: ${SESSION_EVENT_RETENTION_DAYS:-30}
      USB_RETENTION_DAYS: ${USB_RETENTION_DAYS:-90}
      WIFI_RETENTION_DAYS: ${WIFI_RETENTION_DAYS:-90}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
      DEDUPE_RETENTION_DAYS: ${DEDUPE_RETENTION_DAYS:-32}
      SECURITY_EVENT_RETENTION_DAYS: ${SECURITY_EVENT_RETENTION_DAYS:-0}
      INVENTORY_CHANGE_RETENTION_DAYS: ${INVENTORY_CHANGE_RETENTION_DAYS:-90}
      RESOLVED_ALERT_RETENTION_DAYS: ${RESOLVED_ALERT_RETENTION_DAYS:-180}
      MAINTENANCE_BATCH_SIZE: ${MAINTENANCE_BATCH_SIZE:-5000}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-300}
    volumes:
      - ./scripts/db-maintenance.sh:/maintenance.sh:ro
      - ./scripts/maintenance:/maintenance:ro
    entrypoint: ["/bin/sh", "/maintenance.sh"]
    depends_on:
      server:
        condition: service_healthy
    networks:
      - activity-monitor

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  activity-monitor:
    driver: bridge
