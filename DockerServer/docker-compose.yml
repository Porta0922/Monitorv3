services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: activity-monitor-postgres
    environment:
      - POSTGRES_DB=activity_monitor
      - POSTGRES_USER=monitor_user
      - POSTGRES_PASSWORD=monitor_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor_user -d activity_monitor"]
      interval: 5s
      timeout: 10s
      retries: 8
    networks:
      - activity-monitor

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: activity-monitor-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 8
    networks:
      - activity-monitor

  redis:
    image: redis:7-alpine
    container_name: activity-monitor-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 8
    networks:
      - activity-monitor

  server:
    build:
      context: ..
      dockerfile: DockerServer/Dockerfile
    container_name: activity-monitor-server
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AGENT_AUTH_TOKEN: ${AGENT_AUTH_TOKEN:-change-me-in-production}
      DATABASE_URL: postgresql://monitor_user:monitor_password@postgres:5432/activity_monitor
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - activity-monitor

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  activity-monitor:
    driver: bridge
