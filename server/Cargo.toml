[package]
name = "activity-monitor-server"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid", "macros", "migrate"] }
# Native roots honor SSL_CERT_FILE; select ring without generic rustls defaults.
lapin = { version = "4.12.3", default-features = false, features = ["tokio", "rustls-native-certs", "rustls--ring"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
dotenvy = "0.15"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
data-encoding = "2"

[[bin]]
name = "activity-monitor-server"
path = "src/main.rs"
