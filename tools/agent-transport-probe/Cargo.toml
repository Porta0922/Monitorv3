[package]
name = "agent-transport-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
# Native roots honor SSL_CERT_FILE; select ring without generic rustls defaults.
lapin = { version = "4.12.3", default-features = false, features = ["tokio", "rustls-native-certs", "rustls--ring"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
aes-gcm = "0.10.3"
rand = "0.8"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.50"
winapi = { version = "0.3", features = ["winbase"] }
